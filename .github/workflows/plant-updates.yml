name: Plant Updates

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

concurrency:
  group: plant-updates
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send due plant updates
        run: npm run send:plant-updates
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_CONTACT_EMAIL: ${{ vars.WEB_PUSH_CONTACT_EMAIL }}
          PLANT_UPDATES_APP_ORIGIN: ${{ vars.PLANT_UPDATES_APP_ORIGIN }}
