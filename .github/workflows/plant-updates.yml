name: Plant Updates

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      target_user_id:
        description: Optional Firebase Auth user ID to target
        required: false
        type: string
      ignore_schedule:
        description: Ignore nextSendAt and send immediately
        required: false
        default: false
        type: boolean
      dry_run:
        description: Log what would be sent without sending it
        required: false
        default: false
        type: boolean

concurrency:
  group: plant-updates
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send due plant updates
        run: npm run send:plant-updates
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_CONTACT_EMAIL: ${{ vars.WEB_PUSH_CONTACT_EMAIL }}
          PLANT_UPDATES_APP_ORIGIN: ${{ vars.PLANT_UPDATES_APP_ORIGIN }}
          PLANT_UPDATES_FORCE_UID: ${{ inputs.target_user_id }}
          PLANT_UPDATES_IGNORE_SCHEDULE: ${{ inputs.ignore_schedule }}
          PLANT_UPDATES_DRY_RUN: ${{ inputs.dry_run }}
